[workspace]
members = [
    "crates/sshai-core",
    "crates/sshai-protocol",
    "crates/sshai-agent",
    "crates/sshai-ssh",
    "crates/sshai-tools",
    "crates/sshai-mcp",
    "crates/sshai-ai",
    "crates/sshai-cli",
    "termm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
getrandom = "0.3"
nix = { version = "0.30", features = ["process", "signal", "term"] }
rpassword = "7"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vt100 = "0.16"
zeroize = "1"

[profile.release]
strip = "symbols"
